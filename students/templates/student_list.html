<!DOCTYPE html>
<html>
<head>
    <title>Students List</title>
    <th>Action</th>
</head>
<body>

<h1>Students List</h1>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Course</th>
</tr>

{% for student in students %}
<tr>
    <td>{{ student.id }}</td>
    <td>{{ student.name }}</td>
    <td>{{ student.age }}</td>
    <td>{{ student.course }}</td>
    <td>
    <a href="/update/{{ student.id }}">
        Update
    </a>

    |

    <a href="/delete/{{ student.id }}">
        Delete
    </a>
    </td>

    
</tr>
{% endfor %}

</table>

<br>
<a href="/">Add New Student</a>

</body>
</html>
